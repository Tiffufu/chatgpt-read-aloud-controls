<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Read Aloud Preview - ChatGPT</title>
    <script>
        const theme = new URLSearchParams(window.location.search).get('ae-theme');
        if (theme === 'light' || theme === 'dark') {
            document.documentElement.dataset.aeTheme = theme;
        }
    </script>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 180px 24px 48px;
            box-sizing: border-box;
            background: #ffffff;
            color: #1f1f1f;
            font-family: "Segoe UI", sans-serif;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            line-height: 1.6;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0;
        }

        p {
            margin: 0 0 12px;
            max-width: 62ch;
            color: #5f6368;
        }

        code {
            padding: 2px 6px;
            border-radius: 6px;
            background: #f1f1ee;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #202123;
                color: #edf2f8;
            }

            p {
                color: #d1d9e3;
            }

            code {
                background: rgba(255, 255, 255, 0.08);
            }
        }

        html[data-ae-theme="light"] body {
            background: #ffffff;
            color: #1f1f1f;
        }

        html[data-ae-theme="light"] p {
            color: #5f6368;
        }

        html[data-ae-theme="light"] code {
            background: #f1f1ee;
        }

        html[data-ae-theme="dark"] body {
            background: #202123;
            color: #edf2f8;
        }

        html[data-ae-theme="dark"] p {
            color: #d1d9e3;
        }

        html[data-ae-theme="dark"] code {
            background: rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body>
    <main>
        <h1>Read Aloud Player Preview</h1>
        <p>This local harness renders the extension UI without a ChatGPT audio stream.</p>
        <p>Useful query params: <code>ae-theme=dark</code>, <code>ae-duration=420</code>, <code>ae-current=80</code>, and <code>ae-rate=2</code>.</p>
    </main>
    <script src="src/js/content-script.js"></script>
</body>
</html>
