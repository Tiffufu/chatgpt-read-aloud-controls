<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="css/popup.css" />
  </head>
  <body>
    <form id="settingsForm">
      <header>
        <h1>Read Aloud Controls</h1>
        <p>Player settings</p>
      </header>

      <label class="field" for="skipBackSeconds">
        <span>Skip back seconds</span>
        <input id="skipBackSeconds" name="skipBackSeconds" type="number" min="1" max="300" step="1" inputmode="numeric" autocomplete="off" />
      </label>

      <label class="field" for="skipForwardSeconds">
        <span>Skip forward seconds</span>
        <input id="skipForwardSeconds" name="skipForwardSeconds" type="number" min="1" max="300" step="1" inputmode="numeric" autocomplete="off" />
      </label>

      <label class="field" for="playbackRate">
        <span>Default playback speed</span>
        <select id="playbackRate" name="playbackRate"></select>
      </label>

      <label class="field" for="theme">
        <span>Theme</span>
        <select id="theme" name="theme">
          <option value="system">Follow system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </label>

      <label class="checkbox-field" for="autoReadAloud">
        <input id="autoReadAloud" name="autoReadAloud" type="checkbox" />
        <span>Automatically read new responses aloud</span>
      </label>

      <div class="checkbox-setting">
        <div class="checkbox-row">
          <label class="checkbox-field" for="pauseWhileDictating">
            <input id="pauseWhileDictating" name="pauseWhileDictating" type="checkbox" />
            <span>Pause audio while dictating</span>
          </label>
          <button id="dictationHelpButton" class="info-button" type="button" aria-label="About pausing audio during dictation" aria-expanded="false" aria-controls="dictationHelp">i</button>
        </div>
        <p id="dictationHelp" class="setting-help muted" hidden>Pauses Read Aloud during dictation, then resumes 6 seconds earlier. Audio still loading when recording begins won’t be paused.</p>
      </div>

      <p id="status" class="muted" aria-live="polite"></p>
    </form>
    <script src="js/player-settings.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
