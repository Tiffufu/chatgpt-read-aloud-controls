<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Auto Read Aloud runtime tests</title>
<style>body{font:16px system-ui;max-width:900px;margin:40px auto;background:#fafaf8;color:#222}li{margin:12px 0}.fail{color:#b42318}.pass{color:#067647}iframe{display:none}</style>
<h1>Auto Read Aloud runtime tests</h1><p id="summary">Running…</p><ol id="results"></ol>
<script>window.module={exports:{}};document.write('<script src="../../src/js/auto-read-aloud.js?test='+Date.now()+'"><\/script>');</script>
<script>
(async()=>{
 const {install}=module.exports;
 const results=[];
 const assert=(value,message)=>{if(!value)throw new Error(message);};
 const settle=()=>new Promise(resolve=>setTimeout(resolve,0));
 async function check(name,fn){try{await fn();results.push({name,pass:true});}catch(e){results.push({name,pass:false,error:e.message});}}
 function sharedStorage(enabled=false){
  const listeners=[];let settings={autoReadAloud:enabled};
  return {
   local:{get:async()=>({ae_player_settings:settings})},
   onChanged:{addListener:fn=>listeners.push(fn)},
   set(value){settings={autoReadAloud:value};listeners.forEach(fn=>fn({ae_player_settings:{newValue:settings}},'local'));}
  };
 }
 function turn(id,answer,state='complete',read=true){return `<div data-turn-key="${id}"><div data-talvt-turn-state="${state}"><div><h4 data-conversation-role="user">You said:</h4><button aria-label="Edit message"></button></div><div><h4 data-conversation-role="assistant">ChatGPT said:</h4><div data-dil-message-id="message-${id}">${answer}</div>${read?'<button aria-label="Read aloud" aria-pressed="false"></button>':''}</div></div></div>`;}
 async function tab(storage,{history='',href='https://chatgpt.com/c/test'}={}){
  const frame=document.createElement('iframe');document.body.append(frame);
  const doc=frame.contentDocument;doc.body.innerHTML=`<main><div aria-label="Conversation">${history}</div><div id="prompt-textarea" contenteditable="true" role="textbox"></div><button aria-label="Send"></button></main>`;
  const clicks=[];const intents=[];const cancelled=[];const warnings=[];const snapshots=[];const timers=new Map();let nextTimer=0;let listener;let session=0;let tick;
  const runtime={id:'test-extension',onMessage:{addListener:fn=>listener=fn}};
  const publish=(state,extra={})=>doc.dispatchEvent(new CustomEvent('ae-read-aloud-player:playback',{detail:{sessionId:session,state,...extra}}));
  doc.addEventListener('ae-read-aloud-player:playback-intent',e=>intents.push(e.detail));
  doc.addEventListener('ae-read-aloud-player:playback-cancel',e=>cancelled.push(e.detail.requestId));
  doc.addEventListener('ae-read-aloud-player:queue',e=>snapshots.push(e.detail));
  doc.addEventListener('click',e=>{
   if(e.target.matches('button[aria-label="Read aloud"]')){
    const intent=intents.at(-1);clicks.push(e.target.closest('[data-turn-key]').getAttribute('data-turn-key'));session++;
    publish('playing',intent);
   }
  });
  const location={href};
  install({document:doc,chrome:{storage,runtime},location,console:{warn:(...args)=>warnings.push(args)},
   CustomEvent,MutationObserver,queueMicrotask:fn=>queueMicrotask(fn),setTimeout(fn){const id=++nextTimer;timers.set(id,fn);return id;},clearTimeout:id=>timers.delete(id),
   setInterval(fn){tick=fn;return 1;},clearInterval(){tick=null;},addEventListener(){}});
  await settle();
  return {
   doc,clicks,cancelled,publish,location,warnings,runtime,tick(){tick?.();},
   queue(){return snapshots.at(-1);},
   command(action,id,extra={}){doc.dispatchEvent(new CustomEvent('ae-read-aloud-player:queue-command',{detail:{action,id,...extra}}));},
   async send(id,answer='A new answer',read=true){
    doc.getElementById('prompt-textarea').textContent='Test submission '+id;
    doc.querySelector('button[aria-label="Send"]').click();
    doc.querySelector('[aria-label="Conversation"]').insertAdjacentHTML('beforeend',turn(id,answer,'complete',read));await settle();
   },
   async history(id){doc.querySelector('[aria-label="Conversation"]').innerHTML=turn(id,'Historical answer');doc.dispatchEvent(new Event('visibilitychange'));await settle();},
   status(){let response;listener({type:'AE_AUTO_READ_STATUS'},{},value=>response=value);return response;},
   expire(){for(const fn of [...timers.values()])fn();}
  };
 }
 await check('Hydrating and focusing historical conversations stays silent while enabled',async()=>{
  const t=await tab(sharedStorage(true));await t.history('loaded-history');await t.history('another-history');assert(t.clicks.length===0,'historical content started');
 });
 await check('A new fast response starts native Read Aloud once without a manual read click',async()=>{
  const t=await tab(sharedStorage(true),{history:turn('old','Old answer')});await t.send('new');assert(t.clicks.join(',')==='new','new response did not start');t.doc.dispatchEvent(new Event('visibilitychange'));await settle();assert(t.clicks.length===1,'focus repeated playback');
 });
 await check('Pause holds FIFO and completion starts the next native response',async()=>{
  const t=await tab(sharedStorage(true),{history:turn('old','Old answer')});await t.send('first');t.publish('paused');await t.send('second');assert(t.clicks.length===1,'pause was interrupted');t.publish('ended');await settle();assert(t.clicks.join(',')==='first,second','queue did not advance');
 });
 await check('Global settings updates reach two independent queues without replaying history',async()=>{
  const storage=sharedStorage(false);const a=await tab(storage,{history:turn('a-old','Old')});const b=await tab(storage,{history:turn('b-old','Old')});storage.set(true);await settle();assert(a.clicks.length+b.clicks.length===0,'enabling played history');await a.send('a-one');a.publish('paused');await a.send('a-two');await b.send('b-one');assert(a.clicks.join(',')==='a-one','paused tab advanced');assert(b.clicks.join(',')==='b-one','independent tab was blocked');storage.set(false);a.publish('ended');await b.send('b-two');assert(a.clicks.length===1&&b.clicks.length===1,'disabling did not clear pending work');
 });
 await check('Close clears queued items and a future new response is still eligible',async()=>{
  const t=await tab(sharedStorage(true));await t.send('first');t.publish('paused');await t.send('second');t.publish('closed');await settle();assert(t.clicks.length===1,'close started queued audio');await t.send('third');assert(t.clicks.join(',')==='first,third','future response did not start');
 });
 await check('Missing native action surfaces an actionable error in the popup status response',async()=>{
  const t=await tab(sharedStorage(true));await t.send('missing','Completed answer',false);t.expire();assert(/Read Aloud/.test(t.status().error),'missing actionable status');
 });
 await check('Enter submission from the composer covers a dictation-generated transcript',async()=>{
  const t=await tab(sharedStorage(true));const input=t.doc.getElementById('prompt-textarea');input.textContent='A transcribed utterance';input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));t.doc.querySelector('[aria-label="Conversation"]').insertAdjacentHTML('beforeend',turn('dictated','Response to dictated text'));await settle();assert(t.clicks.join(',')==='dictated','composer submission was missed');
 });
 await check('Navigation while queued discards work from the previous conversation',async()=>{
  const t=await tab(sharedStorage(true));await t.send('first');t.publish('paused');await t.send('second');t.location.href='https://chatgpt.com/c/other';await t.history('other-history');t.publish('ended');assert(t.clicks.join(',')==='first','navigation played old pending work');
 });
 await check('Empty Enter followed by opening history cannot arm automatic reading',async()=>{
  const t=await tab(sharedStorage(true),{href:'https://chatgpt.com/'});t.doc.getElementById('prompt-textarea').dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));t.location.href='https://chatgpt.com/c/history';await t.history('history');assert(t.clicks.length===0,'empty submission armed history');
 });
 await check('A settings change during startup wins over an older storage read',async()=>{
  const storage=sharedStorage(false);let finish;storage.local.get=()=>new Promise(resolve=>finish=resolve);const t=await tab(storage);storage.set(true);finish({ae_player_settings:{autoReadAloud:false}});await settle();await t.send('latest-setting');assert(t.clicks.join(',')==='latest-setting','stale startup settings overwrote the checkbox');
 });
 await check('Extension reload stops automatic work in an invalidated tab',async()=>{
  const t=await tab(sharedStorage(true));t.runtime.id=undefined;t.tick();await t.send('after-reload');
  assert(t.clicks.length===0,'invalidated script kept starting playback');
 });
 await check('Settings bridge invalidation cancels pending automatic starts',async()=>{
  const t=await tab(sharedStorage(true));await t.send('pending','Completed answer',false);
  t.doc.dispatchEvent(new CustomEvent('ae-read-aloud-player:extension-invalidated'));
  t.expire();assert(!t.status().error,'invalidated script reported a start timeout');
 });
 await check('Recoverable start failures remain in popup status without extension console warnings',async()=>{
  const t=await tab(sharedStorage(true));await t.send('missing-action','Answer',false);t.expire();
  assert(/button/.test(t.status().error),'missing native button was not identified');
  assert(t.warnings.length===0,'recoverable failure polluted extension errors');
 });
 await check('Manual Read Aloud joins a paused queue without invoking the native button early',async()=>{
  const t=await tab(sharedStorage(false),{history:turn('one','Yes. A useful first response for the reading queue.')+turn('two','A second response for later.')});
  t.doc.querySelector('[data-turn-key="one"] button[aria-label="Read aloud"]').click();await settle();
  assert(t.clicks.join(',')==='one',`first selection did not reach native playback; clicks=${JSON.stringify(t.clicks)}`);
  t.publish('paused',{responseId:'one'});
  t.doc.querySelector('[data-turn-key="two"] button[aria-label="Read aloud"]').click();await settle();
  assert(t.clicks.join(',')==='one','manual selection interrupted current playback');
  assert(t.queue()?.items[0]?.id==='two','manual selection missing from snapshot');
  t.publish('ended',{responseId:'one'});await settle();
  assert(t.clicks.join(',')==='one,two','manual queue did not advance with auto disabled');
 });
 await check('Drawer commands reorder remove and undo the real runtime queue',async()=>{
  const t=await tab(sharedStorage(true));await t.send('first');t.publish('paused',{responseId:'first'});await t.send('second');await t.send('third');
  t.command('move','third',{direction:-1});assert(t.queue()?.items.map(x=>x.id).join(',')==='third,second','move command failed');
  t.command('remove','third');assert(t.queue()?.items[0]?.id==='second','remove command failed');
  t.command('undo');assert(t.queue()?.items[0]?.id==='third','undo command failed');
  t.publish('ended',{responseId:'first'});await settle();assert(t.clicks.join(',')==='first,third','runtime ignored edited order');
 });
 await check('A playing response native stop action is allowed through',async()=>{
  const t=await tab(sharedStorage(false),{history:turn('one','A complete response.')});const button=t.doc.querySelector('button[aria-label="Read aloud"]');
  button.click();await settle();button.setAttribute('aria-pressed','true');button.click();assert(t.clicks.length===2,'native stop was intercepted');
 });
 await check('Source navigation highlights the source without starting audio',async()=>{
  const t=await tab(sharedStorage(false),{history:turn('one','A complete response.')});t.command('reveal','one');
  assert(t.doc.querySelector('[data-turn-key="one"]').hasAttribute('data-ae-queue-highlight'),'source was not highlighted');assert(t.clicks.length===0,'source navigation started audio');
 });
 await check('Manual queue state contains no page nodes and extension invalidation clears it',async()=>{
  const t=await tab(sharedStorage(false),{history:turn('one','A complete response.')});t.publish('paused');t.doc.querySelector('button[aria-label="Read aloud"]').click();
  assert(t.queue()?.items.length===1,'manual item missing');assert(!('node' in t.queue().items[0]),'DOM leaked into queue snapshot');
  t.doc.dispatchEvent(new CustomEvent('ae-read-aloud-player:extension-invalidated'));assert(t.queue().items.length===0,'invalidation retained manual queue');
 });
 await check('Removing a queued successor before its deferred click prevents native playback',async()=>{
  const t=await tab(sharedStorage(false),{history:turn('one','First complete response.')+turn('two','Second complete response.')});
  t.doc.querySelector('[data-turn-key="one"] button[aria-label="Read aloud"]').click();
  t.doc.querySelector('[data-turn-key="two"] button[aria-label="Read aloud"]').click();
  t.publish('ended');t.command('remove','two');await settle();
  assert(t.clicks.join(',')==='one','removed successor started late');assert(t.queue().items.length===0,'removed successor remained in queue');
 });
 await check('A native selection recovers a suspended queue before a drawer exists',async()=>{
  const t=await tab(sharedStorage(true));await t.send('missing','A complete response.',false);t.expire();
  const button=t.doc.createElement('button');button.setAttribute('aria-label','Read aloud');button.setAttribute('aria-pressed','false');t.doc.querySelector('[data-turn-key="missing"]').append(button);button.click();await settle();
  assert(t.clicks.join(',')==='missing','native selection did not retry failed start');assert(!t.status().error,'recovered queue kept its error');
 });
 await check('An idle native Read Aloud click reaches the page unchanged',async()=>{
  const t=await tab(sharedStorage(false),{history:turn('one','A complete response.')});const button=t.doc.querySelector('button[aria-label="Read aloud"]');
  const click=new MouseEvent('click',{bubbles:true,cancelable:true});button.dispatchEvent(click);await settle();
  assert(!click.defaultPrevented,'idle native click was replaced by automation');assert(t.clicks.join(',')==='one','native action did not run');
 });
 await check('Unrecognized content cannot swallow an otherwise valid native Read Aloud action',async()=>{
  const history=turn('one','A complete response.').replace('data-dil-message-id="message-one"','data-new-content-wrapper="one"');
  const t=await tab(sharedStorage(false),{history});const click=new MouseEvent('click',{bubbles:true,cancelable:true});
  t.doc.querySelector('button[aria-label="Read aloud"]').dispatchEvent(click);await settle();
  assert(!click.defaultPrevented,'unrecognized content swallowed native click');assert(t.clicks.join(',')==='one','native fallback did not run');
 });
 await check('Selecting the current response again retains a native restart path',async()=>{
  const t=await tab(sharedStorage(false),{history:turn('one','A complete response.')});const button=t.doc.querySelector('button[aria-label="Read aloud"]');
  button.click();await settle();t.publish('paused',{responseId:'one'});const click=new MouseEvent('click',{bubbles:true,cancelable:true});button.dispatchEvent(click);await settle();
  assert(!click.defaultPrevented,'current response restart was swallowed');assert(t.clicks.join(',')==='one,one','native restart did not run');
 });
 for(const r of results){const li=document.createElement('li');li.className=r.pass?'pass':'fail';li.textContent=`${r.pass?'PASS':'FAIL'}: ${r.name}${r.error?' — '+r.error:''}`;document.getElementById('results').append(li);}
 document.getElementById('summary').textContent=`${results.filter(r=>r.pass).length}/${results.length} passed`;
 document.documentElement.dataset.testResult=results.every(r=>r.pass)?'passed':'failed';
})();
</script></html>
