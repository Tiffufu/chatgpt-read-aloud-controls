<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>README visual review</title>
<style>
    *{box-sizing:border-box}body{margin:0;background:#fff;color:#1f2328;font:14px system-ui,sans-serif}body[data-theme=dark]{background:#0d1117;color:#e6edf3}
    header{max-width:960px;margin:24px auto;padding:0 24px;display:flex;align-items:center;gap:10px}header p{flex:1;margin:0}button{padding:7px 14px;border:1px solid #8886;border-radius:6px;background:transparent;color:inherit;font:inherit;cursor:pointer}button[aria-pressed=true]{outline:2px solid #6c9b87;outline-offset:2px}
    iframe{display:block;width:min(960px,100%);height:2840px;margin:auto;border:0}
</style>
<header><p>README image sequence · theme preview</p><button type="button" data-theme="light">Light</button><button type="button" data-theme="dark">Dark</button></header>
<iframe title="Actual theme-aware picture elements from the README"></iframe>
<script>
    const frame=document.querySelector('iframe');
    function setTheme(theme){
        document.body.dataset.theme=theme;
        frame.style.colorScheme=theme;
        document.querySelectorAll('button').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.theme===theme)));
    }
    document.querySelectorAll('button').forEach(button=>button.onclick=()=>setTheme(button.dataset.theme));
    setTheme('light');
    fetch('../README.md').then(response=>response.text()).then(markdown=>{
        const pictures=[...markdown.matchAll(/<picture>[\s\S]*?<\/picture>/g)].map(match=>match[0]);
        const headings=['Product splash','Expanded player','Minimized player','Reading queue','Settings'];
        const base=new URL('../',location.href).href;
        frame.srcdoc=`<!doctype html><html lang="en"><meta charset="utf-8"><base href="${base}"><style>
            :root{color-scheme:light dark;--bg:#fff;--fg:#1f2328;--border:#d1d9e0} @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--border:#3d444d}}
            body{margin:0;padding:8px 56px;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}h1{font-size:32px;margin:0 0 20px;padding-bottom:8px;border-bottom:1px solid var(--border)}h2{font-size:23px;margin:32px 0 16px}picture{display:block}img{max-width:100%;height:auto}section:first-of-type h2{display:none}
            @media(max-width:640px){body{padding:8px 16px}}
            </style><h1>Read Aloud Controls for ChatGPT</h1>${pictures.map((picture,index)=>`<section><h2>${headings[index]}</h2>${picture}</section>`).join('')}</html>`;
    });
</script>
</html>
